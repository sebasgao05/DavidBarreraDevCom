name: Deploy to AWS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run tests
      run: npm test -- --coverage --watchAll=false --passWithNoTests
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1
    
    - name: Deploy to AWS
      run: npm run deploy
      env:
        REACT_APP_PERSON_NAME: David Barrera
        REACT_APP_CONTACT_EMAIL: sebasgao05@icloud.com
        REACT_APP_LINKEDIN_URL: https://www.linkedin.com/in/sebasgao05/
        REACT_APP_GITHUB_URL: https://github.com/sebasgao05
        REACT_APP_SITE_URL: https://david-barrera.com
        REACT_APP_PROFILE_IMAGE: /images/profile/profile-david.webp
        REACT_APP_OG_IMAGE: /images/profile/profile-david.jpg
        REACT_APP_LOCATION: Bogota, CO
        REACT_APP_CV_ES_URL: /DavidBarrera-BogotaES.pdf
        REACT_APP_CV_EN_URL: /DavidBarrera-BogotaEN.pdf
        DEPLOY_BUCKET_NAME: ${{ secrets.DEPLOY_BUCKET_NAME }}
        DEPLOY_DISTRIBUTION_ID: ${{ secrets.DEPLOY_DISTRIBUTION_ID }}
