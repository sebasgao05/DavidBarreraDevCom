name: Deploy to AWS

on:
  push:
    branches: [ main ]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: pnpm/action-setup@v4
      with:
        version: 10

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Run linting
      run: pnpm run lint

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
    - uses: actions/checkout@v4

    - uses: pnpm/action-setup@v4
      with:
        version: 10

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Run tests
      run: pnpm run test:ci

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@v4

    - uses: pnpm/action-setup@v4
      with:
        version: 10

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Build application
      run: pnpm build
      env:
        REACT_APP_PERSON_NAME: David Barrera
        REACT_APP_CONTACT_EMAIL: sebasgao05@icloud.com
        REACT_APP_LINKEDIN_URL: https://www.linkedin.com/in/sebasgao05/
        REACT_APP_GITHUB_URL: https://github.com/sebasgao05
        REACT_APP_SITE_URL: https://david-barrera.com
        REACT_APP_PROFILE_IMAGE: /images/profile/profile-david.webp
        REACT_APP_OG_IMAGE: /images/profile/profile-david.jpg
        REACT_APP_LOCATION: Bogota, CO
        REACT_APP_CV_ES_URL: /DavidBarrera-BogotaES.pdf
        REACT_APP_CV_EN_URL: /DavidBarrera-BogotaEN.pdf

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: build
        path: build/
        retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: production
    steps:
    - uses: actions/checkout@v4

    - name: Download build artifact
      uses: actions/download-artifact@v4
      with:
        name: build
        path: build/

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Deploy to S3
      run: |
        # 1. Sync static assets with content hashes (immutable, long cache)
        aws s3 sync build/static/ s3://${{ secrets.DEPLOY_BUCKET_NAME }}/static/ \
          --delete \
          --cache-control "public, max-age=31536000, immutable" \
          --size-only

        # 2. Sync media/assets that rarely change (images, icons, PDFs)
        aws s3 sync build/images/ s3://${{ secrets.DEPLOY_BUCKET_NAME }}/images/ \
          --cache-control "public, max-age=604800" \
          --size-only
        aws s3 sync build/icons/ s3://${{ secrets.DEPLOY_BUCKET_NAME }}/icons/ \
          --cache-control "public, max-age=604800" \
          --size-only
        
        # 3. Sync remaining files (excluding already handled)
        aws s3 sync build/ s3://${{ secrets.DEPLOY_BUCKET_NAME }}/ \
          --delete \
          --cache-control "public, max-age=3600" \
          --exclude "static/*" \
          --exclude "images/*" \
          --exclude "icons/*" \
          --exclude "index.html" \
          --exclude "manifest.json"

        # 4. Upload HTML and manifest with no-cache (always fresh)
        aws s3 cp build/index.html s3://${{ secrets.DEPLOY_BUCKET_NAME }}/index.html \
          --cache-control "public, max-age=0, must-revalidate"
        aws s3 cp build/manifest.json s3://${{ secrets.DEPLOY_BUCKET_NAME }}/manifest.json \
          --cache-control "public, max-age=0, must-revalidate" || true

    - name: Invalidate CloudFront cache
      run: |
        aws cloudfront create-invalidation \
          --distribution-id ${{ secrets.DEPLOY_DISTRIBUTION_ID }} \
          --paths "/*"

    - name: Verify deployment
      run: |
        echo "Deployment completed successfully"
        echo "CloudFront invalidation triggered for distribution: ${{ secrets.DEPLOY_DISTRIBUTION_ID }}"
